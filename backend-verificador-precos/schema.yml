openapi: 3.0.3
info:
  title: API Verificador de Preços
  version: 1.0.0
  description: API REST responsável pela consulta de produtos através do código de
    barras.
paths:
  /api/produtos/{codigo_barra}/:
    get:
      operationId: produtos_retrieve
      description: Consulta um produto cadastrado no sistema utilizando o código de
        barras informado.
      summary: Consultar produto pelo código de barras
      parameters:
      - in: path
        name: codigo_barra
        schema:
          type: string
        description: Código de barras utilizado para localizar o produto.
        required: true
      tags:
      - Produtos
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
          description: ''
components:
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
      required:
      - erro
    Produto:
      type: object
      properties:
        codigo_barra:
          type: string
          title: Código de Barras
          maxLength: 20
        nome:
          type: string
          maxLength: 150
        descricao:
          type: string
          title: Descrição
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Preço
        data_atualizacao:
          type: string
          format: date-time
          readOnly: true
          title: Data de Atualização
        imagem:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - codigo_barra
      - data_atualizacao
      - imagem
      - nome
      - preco
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
